<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>請求書作成</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#f4f6f8}iframe{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="app" src="./index.html"></iframe>
<script>
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{
  const w=frame.contentWindow,d=frame.contentDocument;
  if(!d)return;

  function sanitizeFileName(name){
    return String(name||'').replace(/[\\/:*?"<>|]/g,'_').replace(/\s+/g,' ').trim();
  }
  function latestShootDateFromItems(){
    const dates=[...d.querySelectorAll('[data-f="date"]')].map(el=>el.value).filter(Boolean).sort();
    return dates.length?dates[dates.length-1].replaceAll('-',''):'00000000';
  }
  function suggestedPdfName(){
    const project=d.getElementById('projectTitle')?.value.trim()||'作品名';
    return sanitizeFileName(`${latestShootDateFromItems()}_${project}_Invoice_照明_藤田陽介`);
  }
  function maybeSetSuggestedFileName(){
    const input=d.getElementById('pdfFileName');
    if(!input||input.dataset.userEdited==='1')return;
    input.value=suggestedPdfName();
  }

  const project=d.getElementById('projectTitle');
  if(project && !d.getElementById('pdfFileName')){
    const label=d.createElement('label');
    label.style.gridColumn='1/-1';
    label.innerHTML='PDFファイル名<input id="pdfFileName" type="text" placeholder="例：20261020_○○MV_Invoice_照明_藤田陽介">';
    project.closest('label')?.insertAdjacentElement('afterend',label);
  }

  const fileNameInput=d.getElementById('pdfFileName');
  if(fileNameInput){
    fileNameInput.addEventListener('input',()=>fileNameInput.dataset.userEdited='1');
  }
  project?.addEventListener('input',maybeSetSuggestedFileName);
  project?.addEventListener('change',maybeSetSuggestedFileName);

  function wireDates(){
    d.querySelectorAll('[data-f="date"]').forEach(el=>{
      if(el.dataset.filenameWired)return;
      el.dataset.filenameWired='1';
      el.addEventListener('input',maybeSetSuggestedFileName);
      el.addEventListener('change',maybeSetSuggestedFileName);
    });
  }
  wireDates();

  const addBtn=d.getElementById('addLine');
  addBtn?.addEventListener('click',()=>setTimeout(()=>{wireDates();maybeSetSuggestedFileName()},0));
  d.addEventListener('click',e=>{
    if(e.target?.matches?.('[data-remove]'))setTimeout(maybeSetSuggestedFileName,0);
  });

  const printBtn=d.getElementById('printBtn');
  printBtn?.addEventListener('click',e=>{
    e.preventDefault();
    e.stopImmediatePropagation();
    const filename=sanitizeFileName(d.getElementById('pdfFileName')?.value||suggestedPdfName())||'請求書';
    const oldTitle=d.title;
    d.title=filename;
    w.print();
    setTimeout(()=>{d.title=oldTitle},1000);
  },true);

  maybeSetSuggestedFileName();
});
</script>
</body>
</html>
