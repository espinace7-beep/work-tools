<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>請求書作成</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#111827;--muted:#6b7280;--border:#d1d5db;--accent:#111827}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}main{max-width:1100px;margin:0 auto;padding:24px}h1,h2,h3,p{margin:0}.stack{display:grid;gap:18px}.between{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:16px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}label{font-size:14px}input,select,button{font:inherit}input[type=text],input[type=number],input[type=date],select{width:100%;border:1px solid var(--border);border-radius:12px;padding:10px 12px;background:#fff;color:var(--text)}button{border:1px solid var(--border);background:#fff;border-radius:12px;padding:10px 14px;cursor:pointer}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}button.small{padding:7px 10px;font-size:13px}.muted{font-size:13px;color:var(--muted)}.metric-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.metric{background:#fff;border:1px solid var(--border);border-radius:14px;padding:13px}.metric small{color:var(--muted)}.metric strong{display:block;margin-top:3px;font-size:21px}.line-items{display:grid;gap:10px}.line-item{border:1px solid var(--border);border-radius:14px;padding:12px;display:grid;gap:10px}.line-grid{display:grid;grid-template-columns:130px minmax(220px,2fr) 90px 120px 140px auto;gap:8px;align-items:end}.line-grid .amount-display{padding:10px 8px;border:1px solid var(--border);border-radius:12px;background:#f8fafc;text-align:right;white-space:nowrap}.hidden{display:none!important}.preview-wrap{background:#fff;border:1px solid var(--border);border-radius:16px;padding:22px;overflow-x:auto}.invoice-page{width:100%;max-width:900px;margin:0 auto;background:#fff;color:#111;padding:14px 6px 24px}.invoice-top-rule{border-top:2px solid #111;margin-bottom:18px}.invoice-title{font-size:28px;font-weight:700;margin-bottom:32px}.invoice-header{display:grid;grid-template-columns:1.15fr .85fr;gap:46px}.invoice-client{display:grid;gap:16px}.client-name-line{border-bottom:1px solid #111;padding-bottom:8px;font-size:17px;font-weight:700;display:flex;justify-content:space-between}.client-meta{display:grid;gap:6px;font-size:12px}.client-meta .meta-row{display:grid;grid-template-columns:72px 1fr;gap:8px;border-bottom:1px solid #aaa;padding-bottom:3px}.invoice-issuer{font-size:12px;line-height:1.55}.issuer-name-wrap{position:relative;display:inline-block;margin-top:6px}.issuer-name{font-size:14px;font-weight:700;position:relative;z-index:1}.issuer-seal{position:absolute;width:54px;height:54px;object-fit:contain;right:-34px;top:-17px;z-index:2;pointer-events:none}.issue-line{display:grid;gap:4px;margin-bottom:42px}.issue-line div{border-bottom:1px solid #111;padding-bottom:3px}.invoice-message{margin-top:24px;font-size:12px}.invoice-total{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #111;padding:18px 0 8px;margin-top:8px}.invoice-total strong{font-size:24px}.invoice-table{width:100%;border-collapse:collapse;margin-top:14px;font-size:11px;table-layout:fixed}.invoice-table th,.invoice-table td{border-bottom:1px solid #bfc3c9;border-right:1px solid #d6d9dd;padding:7px 5px;vertical-align:top}.invoice-table th:last-child,.invoice-table td:last-child{border-right:0}.invoice-table th{background:#fff;font-weight:700;border-top:2px solid #111;border-bottom:2px solid #111}.invoice-table .date{width:15%}.invoice-table .item{width:39%}.invoice-table .qty{width:10%}.invoice-table .unit{width:14%}.invoice-table .amount{width:22%;text-align:right}.tax-section-row td{background:#e9f2fb;font-weight:700}.tax-summary{width:330px;margin-left:auto;margin-top:18px;font-size:12px}.sum-row{display:grid;grid-template-columns:1fr 120px;gap:12px;padding:5px 0}.sum-row span:last-child{text-align:right}.sum-row.total{font-weight:700;font-size:14px}.notes{margin-top:18px;border-top:1px dotted #777;padding-top:10px;font-size:11px}.bank{margin-top:18px;border-top:2px solid #111;padding-top:8px;font-size:11px;font-weight:600}.print-actions{display:flex;justify-content:flex-end;margin-bottom:12px}@media(max-width:800px){main{padding:12px}.grid2,.grid3{grid-template-columns:1fr}.metric-grid{grid-template-columns:1fr 1fr}.line-grid{grid-template-columns:1fr 1fr}.line-grid .wide{grid-column:1/-1}.preview-wrap{padding:10px}.invoice-page{min-width:760px}}@media print{@page{size:A4 portrait;margin:10mm}body{background:#fff}main{max-width:none;padding:0}.no-print{display:none!important}#invoicePreview{display:block!important;border:0;padding:0}.preview-wrap{border:0;padding:0;overflow:visible}.invoice-page{width:190mm;max-width:190mm;padding:0;margin:0 auto}.invoice-title{font-size:20pt}.invoice-table{font-size:8pt}.invoice-table th,.invoice-table td{padding:2mm 1.5mm}.invoice-issuer,.invoice-message,.client-meta{font-size:8pt}.issuer-seal{width:14mm;height:14mm;right:-8mm;top:-4mm}.invoice-total strong{font-size:17pt}.tax-summary{font-size:8pt;width:72mm}.sum-row{grid-template-columns:1fr 28mm}.notes,.bank{font-size:7.5pt}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="seal.js"></script>
</head>
<body>
<main class="stack">
<section class="card stack no-print"><h2>請求書情報</h2><div class="grid3"><label>請求日<input id="invoiceDate" type="date"></label><label>請求書 No<input id="invoiceNo" type="text" placeholder="例：2026-0810-01"></label><label>作品番号<input id="projectNo" type="text" placeholder="任意"></label></div><div class="grid2"><label>宛先種別<select id="recipientType"><option value="company" selected>会社宛</option><option value="person">個人宛</option></select></label><label>請求先<input id="clientName" type="text" placeholder="例：株式会社○○"></label><label>担当者<input id="clientPerson" type="text" placeholder="例：山田 太郎"></label><label style="grid-column:1/-1">作品名<input id="projectTitle" type="text" placeholder="例：○○ MV / ○○ CM"></label><label style="grid-column:1/-1">PDFファイル名<input id="pdfFileName" type="text" placeholder="例：20261020_○○MV_Invoice_照明_藤田陽介"></label></div></section>
<section class="card stack no-print"><div class="between"><div><h2>明細</h2><p class="muted">消費税は10%で自動計算します。</p></div><button id="addLine" type="button">＋ 明細を追加</button></div><div id="lineItems" class="line-items"></div></section>
<section class="card stack no-print"><h2>源泉徴収・備考</h2><div class="grid2"><label>源泉徴収<select id="withholdingEnabled"><option value="yes" selected>あり（自動計算）</option><option value="no">なし</option></select></label><label>備考<input id="notes" type="text" placeholder="任意"></label></div><p class="muted">源泉徴収ありの場合、税抜報酬額を対象に自動計算します。</p></section>
<div class="metric-grid no-print"><div class="metric"><small>小計</small><strong id="subtotalDisplay">¥0</strong></div><div class="metric"><small>消費税</small><strong id="taxDisplay">¥0</strong></div><div class="metric"><small>税込合計</small><strong id="grossDisplay">¥0</strong></div><div class="metric"><small>源泉徴収額</small><strong id="withholdingDisplay">¥0</strong><small>差引請求額 <span id="netPaymentDisplay">¥0</span></small></div></div>
<div class="no-print"><button id="previewBtn" class="primary" type="button" style="width:100%">請求書をプレビュー</button></div>
<section id="invoicePreview" class="preview-wrap hidden"><div class="print-actions no-print" style="gap:8px;flex-wrap:wrap"><button id="pdfDirectBtn" class="primary" type="button">PDFを作成 / 共有</button><button id="printBtn" type="button">印刷</button></div><div id="previewPage"></div></section>
</main>
<script>
const ISSUER={postal:'〒225-0011',address1:'神奈川県横浜市青葉区あざみ野1丁目',address2:'12-13 クリスタルハイツ 301',phone:'080-1229-3238',email:'f.y.work1234@gmail.com',name:'藤田 陽介',registration:'T8810189138280',bank:'三井住友銀行　普通　千葉支店　8121659　フジタヨウスケ'};
const yen=v=>new Intl.NumberFormat('ja-JP',{style:'currency',currency:'JPY',maximumFractionDigits:0}).format(Math.round(v||0));const lineItems=document.getElementById('lineItems');let serial=0;
function todayValue(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};document.getElementById('invoiceDate').value=todayValue();
function sanitizeFileName(name){return String(name||'').replace(/[\\/:*?"<>|]/g,'_').replace(/\s+/g,' ').trim()}
function latestShootDateFromItems(){const dates=[...document.querySelectorAll('[data-f="date"]')].map(el=>el.value).filter(Boolean).sort();return dates.length?dates[dates.length-1].replaceAll('-',''):'00000000'}
function suggestedPdfName(){const shootDate=latestShootDateFromItems();const project=document.getElementById('projectTitle')?.value.trim()||'作品名';return sanitizeFileName(`${shootDate}_${project}_Invoice_照明_藤田陽介`)}
function maybeSetSuggestedFileName(){const input=document.getElementById('pdfFileName');if(!input||input.dataset.userEdited==='1')return;input.value=suggestedPdfName()}
function addLine(data={}){serial++;const row=document.createElement('div');row.className='line-item';row.dataset.lineId=serial;row.innerHTML=`<div class="line-grid"><label>日付<input data-f="date" type="date" value="${data.date||''}"></label><label class="wide">項目<input data-f="item" type="text" value="${data.item??'照明技術料'}" placeholder="照明技術料"></label><label>日数<input data-f="qty" type="number" min="0" step="0.1" value="${data.qty??1}"></label><label>単価<input data-f="unit" type="number" min="0" step="1" value="${data.unit??0}"></label><div><div style="font-size:14px;margin-bottom:4px">金額</div><div class="amount-display" data-f="amount">¥0</div></div><button class="small" data-remove type="button">削除</button></div>`;lineItems.appendChild(row);row.querySelectorAll('input,select').forEach(el=>{el.addEventListener('input',()=>{calculate();if(el.dataset.f==='date')maybeSetSuggestedFileName()});el.addEventListener('change',()=>{calculate();if(el.dataset.f==='date')maybeSetSuggestedFileName()})});row.querySelector('[data-remove]').addEventListener('click',()=>{row.remove();calculate();maybeSetSuggestedFileName()});calculate()}
function getRows(){return [...document.querySelectorAll('[data-line-id]')].map(row=>{const qty=Math.max(0,Number(row.querySelector('[data-f="qty"]').value||0));const unit=Math.max(0,Number(row.querySelector('[data-f="unit"]').value||0));const amount=Math.round(qty*unit);row.querySelector('[data-f="amount"]').textContent=yen(amount);return{date:row.querySelector('[data-f="date"]').value,item:row.querySelector('[data-f="item"]').value.trim(),qty,unit,amount,tax:10}})}
function calculate(){const rows=getRows(),sub10=rows.reduce((a,r)=>a+r.amount,0),tax10=Math.round(sub10*.10),subtotal=sub10,tax=tax10,gross=subtotal+tax;const enabled=document.getElementById('withholdingEnabled')?.value!=='no';let withholding=0;if(enabled){withholding=subtotal<=1000000?Math.floor(subtotal*.1021):Math.floor(1000000*.1021+(subtotal-1000000)*.2042)}const netPayment=gross-withholding;subtotalDisplay.textContent=yen(subtotal);taxDisplay.textContent=yen(tax);grossDisplay.textContent=yen(gross);withholdingDisplay.textContent=yen(withholding);netPaymentDisplay.textContent=yen(netPayment);return{rows,sub10,tax10,subtotal,tax,gross,withholding,netPayment}}
projectTitle.addEventListener('input',maybeSetSuggestedFileName);projectTitle.addEventListener('change',maybeSetSuggestedFileName);pdfFileName.addEventListener('input',e=>e.currentTarget.dataset.userEdited='1');withholdingEnabled.addEventListener('change',calculate);addLine.addEventListener('click',()=>{addLine();maybeSetSuggestedFileName()});
function fmtDate(v){if(!v)return'';const d=new Date(v+'T00:00:00');return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`};function shortDate(v){if(!v)return'';const d=new Date(v+'T00:00:00');return `${d.getMonth()+1}/${d.getDate()}`}
function buildTableRows(rows){return `<tr class="tax-section-row"><td colspan="5">●税率10%項目</td></tr>${rows.map(r=>`<tr><td>${shortDate(r.date)}</td><td>${r.item||''}</td><td style="text-align:center">${r.qty}</td><td style="text-align:right">${yen(r.unit)}</td><td class="amount">${yen(r.amount)}</td></tr>`).join('')}`}
function buildPreview(){const c=calculate(),invoiceDate=fmtDate(invoiceDateEl.value),invoiceNoV=invoiceNo.value.trim(),projectNoV=projectNo.value.trim(),suffix=recipientType.value==='person'?'様':'御中',client=clientName.value.trim(),person=clientPerson.value.trim(),project=projectTitle.value.trim(),notesV=notes.value.trim();previewPage.innerHTML=`<div class="invoice-page"><div class="invoice-top-rule"></div><div class="invoice-header"><div><div class="invoice-title">請求書</div><div class="invoice-client"><div class="client-name-line"><span>${client||'請求先 未入力'}</span><span>${suffix}</span></div><div class="client-meta"><div class="meta-row"><strong>担当者：</strong><span>${person?`${person} 様`:''}</span></div><div class="meta-row"><strong>作品名：</strong><span>${project}</span></div><div class="meta-row"><strong>作品番号：</strong><span>${projectNoV}</span></div></div><div class="invoice-message">下記の通り、ご請求申し上げます。</div><div class="invoice-total"><span>金額</span><strong>${yen(c.netPayment)} <span style="font-size:12px;font-weight:500">（源泉徴収後）</span></strong></div></div></div><div class="invoice-issuer"><div class="issue-line"><div style="text-align:right">${invoiceDate}</div><div>No　${invoiceNoV}</div></div><div>${ISSUER.postal}</div><div>${ISSUER.address1}</div><div>${ISSUER.address2}</div><div>${ISSUER.phone}</div><div>${ISSUER.email}</div><div class="issuer-name-wrap"><div class="issuer-name">${ISSUER.name}</div><img class="issuer-seal" src="${window.SEAL_DATA||''}" alt="藤田電子印鑑"></div><div style="margin-top:8px">登録番号：${ISSUER.registration}</div></div></div><table class="invoice-table"><thead><tr><th class="date">日付</th><th class="item">項目</th><th class="qty">日数</th><th class="unit">単価</th><th class="amount">金額</th></tr></thead><tbody>${buildTableRows(c.rows)}<tr><td colspan="4"><strong>●税率10%項目 小計</strong></td><td class="amount">${yen(c.sub10)}</td></tr></tbody></table><div class="tax-summary"><div class="sum-row"><span>小計</span><span>${yen(c.subtotal)}</span></div><div class="sum-row"><span>消費税(10%対象)</span><span>${yen(c.tax10)}</span></div><div class="sum-row total"><span>税込合計</span><span>${yen(c.gross)}</span></div><div class="sum-row" style="margin-top:8px"><span><strong>源泉徴収額</strong></span><span>${yen(c.withholding)}</span></div><div class="sum-row total"><span>差引請求額</span><span>${yen(c.netPayment)}</span></div><div class="sum-row" style="margin-top:10px"><span>10%対象合計</span><span>${yen(c.sub10+c.tax10)}</span></div></div><div class="notes"><strong>備考</strong><br>${notesV}</div><div class="bank">振り込み先：${ISSUER.bank}</div></div>`;invoicePreview.classList.remove('hidden');invoicePreview.scrollIntoView({behavior:'smooth'})}
const invoiceDateEl=document.getElementById('invoiceDate');previewBtn.addEventListener('click',buildPreview);printBtn.addEventListener('click',()=>window.print());pdfDirectBtn.addEventListener('click',async()=>{const page=document.querySelector('.invoice-page');if(!page){alert('先に請求書をプレビューしてください。');return}if(typeof html2pdf==='undefined'){alert('PDF機能の読み込みに失敗しました。再読み込みしてください。');return}const baseName=sanitizeFileName(pdfFileName.value||suggestedPdfName())||'請求書',fileName=`${baseName}.pdf`,oldText=pdfDirectBtn.textContent;pdfDirectBtn.disabled=true;pdfDirectBtn.textContent='PDF作成中…';try{const worker=html2pdf().set({margin:[8,8,8,8],filename:fileName,image:{type:'jpeg',quality:.98},html2canvas:{scale:2,useCORS:true,backgroundColor:'#fff',logging:false,scrollX:0,scrollY:0},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}}).from(page).toPdf();const blob=await worker.outputPdf('blob'),file=new File([blob],fileName,{type:'application/pdf'});if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]})))await navigator.share({files:[file],title:baseName});else{const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=fileName;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}}catch(err){if(err?.name!=='AbortError'){console.error(err);alert('PDFの作成に失敗しました。')}}finally{pdfDirectBtn.disabled=false;pdfDirectBtn.textContent=oldText}});addLine();maybeSetSuggestedFileName();
</script>
</body>
</html>
