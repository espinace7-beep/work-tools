<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>照明機材表｜ARC</title><meta name="description" content="アークの機材表を直接編集してPDFに保存"><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#17202e;font:14px/1.6 -apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #d3dae3;background:#fff;border-radius:10px;min-height:44px;padding:9px 14px;color:inherit}button:disabled{opacity:.45;cursor:wait}button.primary{background:#17202e;color:#fff;border-color:#17202e}:focus-visible{outline:3px solid #6485dc;outline-offset:2px}[hidden]{display:none!important}h1,h2,p{margin:0}h1{font-size:22px}h2{font-size:16px}.sub{font-size:12px;color:#637182}.app{max-width:1450px;margin:auto;padding:20px}.header{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap;margin-bottom:16px}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}.card{background:white;border:1px solid #dce2e9;border-radius:14px;padding:15px}.sheet-card{padding:12px}.sheet-toolbar{margin-bottom:12px}.viewport{overflow:auto;max-height:82vh;background:#edf1f5;border-radius:8px;overscroll-behavior:contain;touch-action:pan-x pan-y pinch-zoom}.paper{position:relative;width:100%;background:white;aspect-ratio:595/842;flex-shrink:0}.paper canvas{display:block;width:100%;height:100%}.cells{position:absolute;inset:0}.cell{position:absolute;border:0;border-radius:0;padding:0;min-height:0;background:rgba(75,116,195,.035);font-size:0}.cell:hover,.cell:focus-visible{background:rgba(75,116,195,.15);outline:2px solid #6d94dd;z-index:2}.cell.edited{background:rgba(75,116,195,.07)}.cell.selected{outline:2px solid #4067ba;background:rgba(75,116,195,.16);z-index:3}.cell.bad{background:rgba(200,126,30,.15)}.total{font-size:30px;font-weight:650;margin:5px 0;font-variant-numeric:tabular-nums}.price-row{border-top:1px solid #e8ecf0;padding:9px 0;font-size:12px}.price-line{display:flex;justify-content:space-between;gap:12px}.price-line button{min-width:0;text-align:left;padding:4px 6px;font-size:12px}.price-line>span{white-space:nowrap}.price-row small{display:block;color:#637182;font-size:11px}.aside{position:sticky;top:15px}.note{background:#f3f5f8;border-radius:8px;padding:10px;margin-top:12px;font-size:12px}.warn{color:#986218}.save{font-size:12px;color:#637182;margin-top:8px}.banner{margin-bottom:12px;border:1px solid #edce9e;background:#fff7e8;border-radius:10px;padding:12px}details summary{cursor:pointer;min-height:32px;padding:5px 0}dialog{border:0;border-radius:18px;padding:0;width:min(540px,calc(100vw - 24px));max-height:88dvh;box-shadow:0 18px 70px #0003;color:inherit}dialog::backdrop{background:#17202e70}.editor{padding:20px;overflow:auto;max-height:88dvh}.editor-header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.editor label{display:block;font-size:12px;color:#637182;margin-top:10px}.editor input,.editor textarea,.editor select{display:block;width:100%;border:1px solid #d2d9e2;border-radius:10px;padding:10px 12px;color:#17202e;background:white;font-size:16px;margin-top:5px}.editor textarea{min-height:75px;resize:vertical}.number-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.predictions{display:flex;flex-direction:column;gap:5px;margin-top:10px;max-height:220px;overflow:auto}.predictions button{text-align:left;font-size:12px;padding:8px 10px}.predictions small{display:block;color:#637182}.editor-footer{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.editor-hint{font-size:12px;margin-top:8px;min-height:20px}.sheet-toolbar select{max-width:160px;border:1px solid #d3dae3;background:#fff;border-radius:10px;padding:9px;min-height:44px}.unplaced{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid #edce9e;padding:7px 0}.catalog-search{width:100%;font-size:16px;border:1px solid #d3dae3;border-radius:8px;padding:9px;margin:8px 0}.catalog-list button{display:block;text-align:left;width:100%;margin:5px 0;font-size:12px}.catalog-list small{display:block;color:#637182}@media(max-width:950px){.layout{grid-template-columns:1fr}.aside{position:static;grid-row:1}.aside details{margin-top:5px}.app{padding:12px}.viewport{max-height:74vh}.total{font-size:24px}.aside .note{margin-top:8px}.editor{padding:16px}}
</style></head><body><main class="app" id="arc-app"><div class="header"><div><h1>照明機材表</h1><p class="sub">表の機材名・数量・各項目をタップして編集</p></div><button class="primary" data-action="pdf" disabled>PDFを保存</button></div><div class="banner" data-unplaced hidden></div><div class="layout"><section class="card sheet-card"><div class="toolbar sheet-toolbar"><button data-action="fit">全体</button><button data-action="zoom-out" aria-label="縮小">−</button><button data-action="zoom-in" aria-label="拡大">＋ 拡大</button><select data-jump aria-label="表の位置へ移動"><option value="">項目へ移動</option><option value="header">作品名・日付</option><option value="light">ライト</option><option value="stand">スタンド</option><option value="grip">グリップ</option><option value="power">ケーブル・電源</option><option value="frame">フレーム・クロス</option><option value="notes">備考</option></select><span class="sub" data-zoom></span></div><p class="sub" style="margin-bottom:10px">空欄も印刷済みの項目も編集できます。必要な機材だけ数量を入力してください。</p><div class="viewport" data-viewport><div class="paper" data-paper><canvas id="arc-canvas" aria-label="アーク発注書"></canvas><div class="cells" data-cells></div></div></div><p class="save" data-save>原本とカタログを読み込み中…</p><p class="warn sub" data-overflow></p></section><aside class="card aside"><p class="sub">あなたの確認用 · 概算料金</p><div class="total" data-total>—</div><p class="sub" data-status></p><details><summary>料金の内訳</summary><div data-prices></div></details><div class="note">税別・1日分。数量が入った項目のみ集計。点灯料・燃料・割引・別発注品は未加算。フォグの初日ジュースは加算。料金はPDFに入りません。</div><details style="margin-top:12px"><summary>カタログから探す</summary><input class="catalog-search" data-search placeholder="略称・型番で検索"><p class="sub" data-catalog-status></p><div class="catalog-list" data-catalog-list></div></details></aside></div></main>
<dialog id="arc-editor"><div class="editor"><div class="editor-header"><h2 data-editor-title>編集</h2><button data-action="close-editor" aria-label="編集を閉じる">閉じる</button></div><div data-equipment><label>機材名<input data-edit-name autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="例：600c pro2、センチ大"></label><div class="number-row"><label>数量<input data-edit-qty type="number" min="1" step="1" inputmode="numeric" placeholder="必要数"></label><label>単位<select data-edit-unit><option value="">単位を選択</option><option>台</option><option>本</option><option>個</option><option>枚</option><option>セット</option><option>時間</option><option>km</option></select></label></div><label data-note-label>この機材の備考<input data-edit-note placeholder="備考"></label></div><div data-general hidden><label data-general-label>内容<textarea data-edit-text></textarea><input data-edit-date type="date" hidden></label></div><p class="editor-hint" data-editor-hint aria-live="polite"></p><div class="predictions" data-predictions></div><div class="editor-footer"><button data-action="clear-cell">この欄を空にする</button><button class="primary" data-action="close-editor">完了</button></div><p class="sub" style="margin-top:10px">変更は機材表・概算に即時反映し、自動保存します。</p></div></dialog>
