<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>照明機材表｜ARC</title><meta name="description" content="機材表の入力とPDF出力"></head><body style="margin:0;background:#f4f6f8"><div id="arc-input-prototype">
<style>
#arc-input-prototype{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif;color:#17202e;background:#f4f6f8;padding:22px;border-radius:18px;font-size:14px;line-height:1.6}#arc-input-prototype *{box-sizing:border-box}#arc-input-prototype h2,#arc-input-prototype h3,#arc-input-prototype p{margin:0}#arc-input-prototype .ai-sub{color:#657080;font-size:12px}#arc-input-prototype .ai-header{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px;flex-wrap:wrap}#arc-input-prototype .ai-card{background:#fff;border:1px solid #dce1e7;border-radius:16px;padding:18px;margin-bottom:16px}#arc-input-prototype .ai-layout{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}#arc-input-prototype .ai-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}#arc-input-prototype input,#arc-input-prototype textarea{font:inherit;font-size:16px;color:#17202e;border:1px solid #d2d9e2;border-radius:11px;padding:10px 12px;width:100%;background:#fff}#arc-input-prototype textarea{min-height:112px;resize:vertical;line-height:1.8;margin-top:8px}#arc-input-prototype label{display:block}#arc-input-prototype button{font:inherit;border:1px solid #d2d9e2;border-radius:10px;background:#fff;color:#17202e;padding:10px 15px;min-height:44px}#arc-input-prototype .ai-solid{background:#17202e;color:#fff;border-color:#17202e}#arc-input-prototype .ai-title{display:flex;justify-content:space-between;align-items:center;gap:12px}#arc-input-prototype .ai-total{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:7px}#arc-input-prototype .ai-note{background:#f5f7fa;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:12px}#arc-input-prototype .ai-conversion{font-size:12px;margin-top:8px;overflow-wrap:anywhere}#arc-input-prototype .ai-conversion div{padding:6px 0;border-bottom:1px solid #edf0f3}#arc-input-prototype .ai-warn{color:#8e5517}#arc-input-prototype .ai-paper{border:1px solid #bac2cc;background:white;padding:14px;color:#171717}#arc-input-prototype .ai-paper h3{text-align:center;letter-spacing:.4em;font-size:22px;margin-bottom:12px}#arc-input-prototype table{border-collapse:collapse;width:100%;font-size:12px;table-layout:fixed}#arc-input-prototype th,#arc-input-prototype td{border:1px solid #b8b8b8;padding:6px;text-align:left;overflow-wrap:anywhere;vertical-align:top}#arc-input-prototype th{background:#f1f2f4}#arc-input-prototype th:last-child,#arc-input-prototype td:last-child{width:40px;text-align:center}#arc-input-prototype .ai-live{font-size:12px;color:#566271}#arc-input-prototype .ai-breakdown{margin-top:12px}#arc-input-prototype .ai-price-row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid #edf0f3;font-size:12px}#arc-input-prototype .ai-price-row span:last-child{white-space:nowrap}#arc-input-prototype .ai-group{margin-top:16px}#arc-input-prototype .ai-group:first-child{margin-top:0}@media(max-width:720px){#arc-input-prototype{padding:12px}#arc-input-prototype .ai-layout{grid-template-columns:1fr}#arc-input-prototype .ai-card{padding:14px}}@media(max-width:400px){#arc-input-prototype .ai-fields{grid-template-columns:1fr}}
#arc-input-prototype canvas{width:100%;height:auto;display:block}#arc-input-prototype .ai-actions{display:flex;gap:8px;flex-wrap:wrap}#arc-input-prototype .ai-paper{padding:0}#arc-input-prototype .ai-total{overflow-wrap:anywhere}#arc-input-prototype .ai-fields label{min-width:0}
#arc-input-prototype select{font:inherit;padding:8px;width:100%;border:1px solid #d2d9e2;border-radius:8px;background:#fff;color:#17202e}#arc-input-prototype small{display:block;font-size:11px;color:#657080;line-height:1.5;margin-top:4px}#arc-input-prototype .ai-catalog{margin-top:20px}#arc-input-prototype .ai-catalog summary{cursor:pointer;font-weight:600}#arc-input-prototype .ai-catalog label{margin:12px 0}#arc-input-prototype .ai-table-scroll{overflow:auto;margin:10px 0}#arc-input-prototype .ai-catalog-table{min-width:300px;table-layout:auto}#arc-input-prototype .ai-catalog-table th:nth-child(2){width:80px}#arc-input-prototype .ai-catalog-table td:nth-child(2){white-space:nowrap}#arc-input-prototype button:disabled{opacity:.45}#arc-input-prototype :focus-visible{outline:2px solid #526bbc;outline-offset:2px}

#arc-input-prototype .ai-tabs{display:flex;gap:6px;overflow-x:auto;margin:16px 0 12px;padding-bottom:6px}#arc-input-prototype .ai-tabs button{white-space:nowrap;flex-shrink:0;padding:9px 12px}#arc-input-prototype .ai-tabs button[aria-selected="true"]{background:#17202e;color:#fff;border-color:#17202e}#arc-input-prototype .ai-tabs span:not(:empty){margin-left:6px;font-size:11px;opacity:.75}#arc-input-prototype [hidden]{display:none!important}#arc-input-prototype .ai-tab-label{margin-bottom:12px}#arc-input-prototype .ai-entry{padding:12px 0;border-bottom:1px solid #edf0f3;margin-bottom:12px}#arc-input-prototype .ai-entry-fields{display:grid;grid-template-columns:minmax(0,1fr) 68px 84px 36px;gap:7px;align-items:end}#arc-input-prototype .ai-entry-fields label{font-size:12px;color:#657080;min-width:0}#arc-input-prototype .ai-entry-fields input,#arc-input-prototype .ai-entry-fields select{margin-top:5px;height:44px;padding:8px}#arc-input-prototype .ai-remove{padding:8px;font-size:20px}#arc-input-prototype .ai-suggestions{display:flex;flex-direction:column;gap:5px;max-height:280px;overflow:auto}#arc-input-prototype .ai-suggestions button{text-align:left;padding:8px 10px;font-size:12px;overflow-wrap:anywhere}#arc-input-prototype .ai-conversion>div{border:0}#arc-input-prototype button{cursor:pointer}@media(max-width:500px){#arc-input-prototype .ai-entry-fields{grid-template-columns:minmax(0,1fr) 82px 36px}#arc-input-prototype .ai-entry-fields label:first-child{grid-column:1/-1}#arc-input-prototype .ai-entry-fields label:nth-child(2){grid-column:1}#arc-input-prototype .ai-entry-fields input[data-qty]{max-width:100px}}

<div class="ai-header"><div><h2>照明機材表</h2><p class="ai-sub">入力を自動保存 · 作業版</p></div><div class="ai-actions"><button type="button" data-action="sample">入力例</button> <button type="button" class="ai-solid" data-action="pdf">PDFを保存</button></div></div>
<div class="ai-card"><div class="ai-fields"><label>作品名<input data-meta="title" placeholder="作品名を入力"></label><label>撮影日<input type="date" data-meta="date"></label><label>照明技師<input data-meta="ld" value="藤田陽介"></label><label>搬入・搬出<input data-meta="move" placeholder="例：前日引取／翌日返却"></label></div></div>
<div class="ai-layout"><section class="ai-card"><div class="ai-title"><h3>機材を入力</h3><span class="ai-sub">1行に1機材</span></div><p class="ai-sub">ジャンルのタブを選び、機材名・数量・単位を別々に入力。略称・小文字でも候補を表示</p><div data-slot="inputs"></div><details class="ai-catalog ai-note" data-catalog><summary>照合済みカタログを確認</summary><p data-catalog-meta>読み込み中</p><label>名称で検索<input data-catalog-search type="search" placeholder="例：600c、クロス、スタンド"></label><p data-catalog-status></p><div class="ai-table-scroll"><table class="ai-catalog-table"><thead><tr><th>掲載名称・条件</th><th>税別料金</th><th>ページ</th></tr></thead><tbody data-catalog-rows></tbody></table></div><div class="ai-actions"><button data-catalog-prev type="button">前へ</button><button data-catalog-next type="button">次へ</button></div></details></section>
<section><div class="ai-card" aria-live="polite"><p class="ai-sub">あなたの確認用 · 概算料金</p><div class="ai-total" data-slot="total">¥0</div><div data-slot="status" class="ai-live"></div><div class="ai-note">税別・1日分の掲載料金。点灯料・燃料・別発注品・割引は未加算。フォグの初日ジュースは加算。料金はPDFに含めません。</div><div data-slot="prices" class="ai-breakdown"></div></div>
<div class="ai-card"><div class="ai-title"><h3>機材表プレビュー</h3><span class="ai-sub">入力と連動</span></div><p class="ai-sub" style="margin:6px 0 12px">アークの原本に記入。左の空欄へ転記する初期版です。</p><div class="ai-paper"><canvas id="arc-canvas" aria-label="アーク発注書プレビュー"></canvas></div><p class="ai-sub" data-slot="overflow"></p><div class="ai-note">候補が複数ある略称は選択して確定。セット品は数量と「本」「セット」を選択してください。未照合の機材は入力名を保持します。</div></div></section></div>
</div>
