<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>照明機材リスト｜ARC</title><meta name="description" content="スマホで機材を選んでアークの発注書へ自動転記"><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#182334;font:14px/1.6 -apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif}button,input,select,textarea{font:inherit;color:inherit}button{border:1px solid #d9dfe7;border-radius:11px;padding:9px 13px;background:white;min-height:44px;cursor:pointer}button.primary{background:#20334e;border-color:#20334e;color:#fff}button:disabled{opacity:.4;cursor:default}input,select,textarea{border:1px solid #d9dfe7;border-radius:10px;padding:10px;background:#fff;font-size:16px;min-width:0}input,textarea{width:100%}label{display:block;font-size:12px;color:#667386}label input,label textarea{margin-top:5px}textarea{min-height:70px}h1,h2,h3,p{margin:0}h1{font-size:23px;letter-spacing:-.03em}h2{font-size:17px}h3{font-size:13px;color:#667386}.sub{color:#667386;font-size:12px}.app{max-width:760px;margin:auto;padding:18px 14px 140px}.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.brand{font-size:10px;letter-spacing:.15em;color:#667386}.card{background:white;border:1px solid #e1e6ec;border-radius:17px;padding:16px;margin-bottom:14px}.jobbar{display:flex;gap:7px;margin-bottom:12px}.jobbar select{flex:1;width:0}.jobbar button{padding:8px 10px}.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.wide{grid-column:1/-1}summary{cursor:pointer;min-height:36px;padding:6px 0;font-weight:600}.search-box{display:flex;gap:6px;margin-top:12px}.search-box input{font-size:17px;padding:13px;min-height:50px}.filters{display:flex;gap:5px;overflow-x:auto;margin:10px -2px;padding-bottom:5px}.filters button{white-space:nowrap;min-height:36px;padding:5px 11px;font-size:12px}.filters button[aria-pressed="true"]{background:#e8eef7;border-color:#a6b8d2}.results{max-height:365px;overflow:auto}.result{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid #edf0f4}.result-name{font-weight:550;font-size:13px;overflow-wrap:anywhere}.result small{display:block;color:#667386;font-size:11px}.result button{flex-shrink:0;color:#294e7e}.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.quick button{font-size:12px;text-align:left;max-width:100%}.empty{text-align:center;padding:28px 10px;color:#667386}.section-heading{display:flex;justify-content:space-between;align-items:center;margin:18px 0 10px}.group{margin-top:16px}.item{border:1px solid #e1e6ec;border-radius:15px;background:#fff;padding:13px;margin-top:8px}.item-top{display:flex;align-items:start;justify-content:space-between;gap:10px}.item-name{font-weight:600;font-size:14px;text-align:left;border:0;padding:0;min-height:32px;background:none;overflow-wrap:anywhere}.remove{border:0;min-height:32px;padding:3px 8px;color:#8d9aad;font-size:18px}.item-bottom{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-top:9px}.stepper{display:flex;align-items:center;gap:5px}.stepper button{padding:5px;width:40px;min-height:42px;font-size:20px}.stepper input{width:64px;text-align:center;padding:8px 4px;min-height:42px}.stepper select{max-width:85px;padding:8px 5px;font-size:14px;min-height:42px}.row-price{font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}.warning{color:#9a671a;font-size:12px;margin-top:6px}.item small{display:block;font-size:11px;color:#667386;margin-top:5px}.footer{position:fixed;bottom:0;left:0;right:0;z-index:10;background:#fffffff2;border-top:1px solid #dce3ec;backdrop-filter:blur(10px);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}.footer-inner{max-width:732px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.total{font-size:24px;font-weight:650;font-variant-numeric:tabular-nums}.footer button{padding:12px 18px;white-space:nowrap}.save{text-align:right;font-size:11px;color:#667386;margin-top:9px}.paper{width:100%;background:#fff;border:1px solid #dce3ec}.paper canvas{display:block;width:100%;height:auto}.preview-help{font-size:12px;margin:8px 0;color:#667386}.banner{background:#fff6e6;border:1px solid #edce9e;border-radius:10px;padding:10px;margin-bottom:12px;font-size:12px}.toast{position:fixed;bottom:115px;left:50%;transform:translateX(-50%);background:#20334e;color:white;padding:10px 14px;border-radius:12px;z-index:25;max-width:calc(100% - 24px);display:flex;align-items:center;gap:10px;box-shadow:0 5px 18px #0002;font-size:12px}.toast button{color:white;border-color:#67819e;background:transparent;padding:4px 8px;min-height:32px}dialog{border:0;border-radius:18px;padding:20px;width:min(530px,calc(100vw - 24px));max-height:85dvh;overflow:auto;box-shadow:0 20px 70px #0004}dialog::backdrop{background:#18233480}.dialog-header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.predictions{display:flex;flex-direction:column;gap:5px;max-height:220px;overflow:auto;margin-top:8px}.predictions button{text-align:left;font-size:12px}.note{margin:12px 0;background:#f5f7fa;border-radius:9px;padding:10px;font-size:11px;color:#667386}[hidden]{display:none!important}:focus-visible{outline:3px solid #789bd4;outline-offset:2px}@media(max-width:370px){.app{padding:12px 10px 140px}.card{padding:12px}.stepper{gap:3px}.stepper input{width:50px}.stepper button{width:34px}.stepper select{max-width:70px}.total{font-size:21px}}
</style></head><body><main class="app" id="arc-app"><header class="header"><div><p class="brand">ARC SYSTEM · EQUIPMENT</p><h1>照明機材リスト</h1></div><span class="sub" data-count>0項目</span></header><div class="jobbar"><select data-jobs aria-label="保存した案件"></select><button data-action="new-job">新規</button><button data-action="copy-job">複製</button></div><details class="card" data-meta-panel><summary data-meta-summary>作品名・日付を入力</summary><div class="meta-grid"><label class="wide">作品名<input data-meta="title" placeholder="作品名"></label><label>撮影日<input data-meta="date" type="date"></label><label>照明技師<input data-meta="ld"></label><label class="wide">搬入・搬出<input data-meta="move" placeholder="例：前日引取／翌日返却"></label><label class="wide">提出用の備考<textarea data-meta="notes" placeholder="現場への連絡事項"></textarea></label></div><details><summary class="sub">その他の提出項目</summary><div class="meta-grid"><label>PD<input data-meta="pd"></label><label>PM<input data-meta="pm"></label><label>AL<input data-meta="al"></label><label>ST<input data-meta="st"></label></div></details></details><section class="card"><h2>機材を追加</h2><div class="search-box"><input data-search type="search" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="600c、センチ大、6×6 LGC…" aria-label="機材を検索"><button data-action="clear-search" aria-label="検索を消す">×</button></div><div class="filters" data-filters></div><div data-quick></div><p class="sub" data-search-status></p><div class="results" data-results></div></section><div class="section-heading"><h2>選んだ機材</h2><button data-action="preview">提出用を確認</button></div><p class="sub">機材名をタップすると名称・備考を変更できます。</p><div data-list></div><div class="save" data-save>読み込み中…</div><details class="card" data-preview style="margin-top:18px"><summary>アーク提出用の機材表</summary><p class="preview-help">プリセットの機材はその数量欄へ。ライトと灯体用アクセサリーは一列目、その他は対応する列へ転記。料金はPDFに入りません。</p><div class="banner" data-layout-warning hidden></div><div class="paper"><canvas id="arc-canvas" aria-label="提出用発注書プレビュー"></canvas></div><p class="warning" data-overflow></p></details><div class="note">概算は税別・1日分。点灯料・燃料・割引・別発注品は未加算。フォグの初日ジュースは加算。入力はこのブラウザに保存されます。</div></main><footer class="footer"><div class="footer-inner"><div><p class="sub">確認用の概算 · 税別</p><div class="total" data-total>—</div><p class="sub" data-status></p></div><button class="primary" data-action="pdf" disabled>PDFを保存</button></div></footer><div class="toast" data-toast hidden><span data-toast-text></span><button data-action="undo" hidden>元に戻す</button></div><dialog id="arc-editor"><div class="dialog-header"><h2>機材の詳細</h2><button data-action="close-editor">完了</button></div><label>機材名<input data-edit-name autocomplete="off" autocapitalize="off" spellcheck="false"></label><p class="warning" data-edit-status></p><div class="predictions" data-predictions></div><label data-placement-label style="margin-top:15px">カタログ未照合の機材の配置先<select data-edit-column style="display:block;width:100%;margin-top:5px"><option value="">選択してください</option><option value="0">一列目：ライト・灯体用アクセサリー</option><option value="1">二列目：スタンド・グリップ</option><option value="2">三列目：ケーブル・電源・制御</option><option value="3">四列目：フレーム・クロス・その他</option></select></label><label style="margin-top:15px">この機材の備考<textarea data-edit-note placeholder="例：人物用、屋外用"></textarea></label><p class="sub" style="margin-top:10px">変更はリストと提出用機材表へ自動反映します。</p></dialog><script src="./catalog-core.js?v=1e125c5daac2" defer></script><script src="./sheet-model.js?v=095dc35e90fd" defer></script><script src="./order-model.js?v=5421d68f42d1" defer></script><script src="./app.js?v=8fdabc327991" defer></script></body></html>
